name: PHP Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the declared floor; the 8.x entries exist because the plugin
        # runs on whatever PHP the customer's host provides, and a compile
        # error can be version-specific. The `floor` job below keeps this list
        # honest against the "Requires PHP" header.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 \
            | xargs -0 -r -n1 -P4 php -l

  floor:
    name: Declared PHP floor is covered by the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Requires PHP header must appear in the lint matrix
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Requires PHP:[[:space:]]*//p' bynli-connect.php | tr -d '[:space:]')"
          if [ -z "$declared" ]; then
            echo "::error file=bynli-connect.php::No 'Requires PHP' header found."
            exit 1
          fi
          echo "Plugin declares PHP $declared"
          if ! grep -q "'${declared}'" .github/workflows/php-lint.yml; then
            echo "::error::Plugin declares PHP ${declared} but the lint matrix does not include it. Add it to the matrix or update the header."
            exit 1
          fi
          echo "Matrix covers the declared floor."
